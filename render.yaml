services:
  - type: web
    name: leetcode-streaks-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
